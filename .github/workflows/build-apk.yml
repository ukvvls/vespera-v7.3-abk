name: Build VESPERA APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'VESPERA-Android-Project-V7.2.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -q VESPERA-Android-Project-V7.2.zip -d extracted

      - name: Build APK
        run: gradle assembleDebug
        working-directory: extracted/VESPERA-Android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VESPERA-V7.2-APK
          path: extracted/VESPERA-Android/app/build/outputs/apk/debug/app-debug.apk
